<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAS Конфигуратор — Xpenology / DSM</title>
    <meta name="description" content="Пошаговый конфигуратор кастомного NAS на базе Xpenology (DSM). Абстрактные требования к железу, расчёт RAID, образовательные инсайты." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0f1729;
      ">
        <div style="text-align: center;">
          <div style="
            width: 40px; height: 40px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 16px;
          "></div>
          <div style="color: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 14px;">
            Загрузка конфигуратора...
          </div>
        </div>
      </div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg) } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
